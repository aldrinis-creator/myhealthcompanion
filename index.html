<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="MyHealthCompanion — Your personal health management dashboard for medications, vitals, appointments and wellness tracking." />
    <title>MyHealthCompanion</title>
    <script>
      // GitHub Pages SPA redirect restoration
      (function(){
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        } else {
          // Handle 404.html query-string redirect
          var q = window.location.search;
          if (q.length > 2 && q[1] === '/') {
            var decoded = q.slice(2).split('&').map(function(s){ return s.replace(/~and~/g, '&'); }).join('?');
            var basePath = window.location.pathname;
            if (!basePath.endsWith('/')) basePath += '/';
            history.replaceState(null, null, basePath + decoded + window.location.hash);
          }
        }
      })();
    </script>
  </head>
  <body>
    <div id="deployment-marker" style="display:none">VERSION_4_ACTIVE</div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
